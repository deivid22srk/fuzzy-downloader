[package]
name = "fuzzy_dl"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Downloader segmentado genérico (JNI + CLI) do Fuzzy"
license = "MIT"

[lib]
name = "fuzzy_dl"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "fuzzy-dl"
path = "src/bin/cli.rs"

[dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util", "signal"] }
wreq = { version = "0.16.3", default-features = false, features = ["stream", "webpki-roots", "tokio-rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jni = "0.21"
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
# `z` faz o btls-sys compilar a BoringSSL com MinSizeRel (menos espaço no APK).
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ANDROID_NDK_VERSION: "28.2.13676358"
  CARGO_NDK_VERSION: "4.1.2"

jobs:
  android:
    name: Rust + Android (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Necessário para usar secrets em `if:` (não são permitidos diretamente).
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache do Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/fuzzy_dl -> target

      - name: Pacotes do Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n1)"
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: cargo-ndk
        run: cargo install cargo-ndk --version "${CARGO_NDK_VERSION}" --locked

      - name: Testes Rust (servidor local)
        working-directory: rust/fuzzy_dl
        run: cargo test --all-targets

      - name: Compilar cdylib para Android
        working-directory: rust/fuzzy_dl
        run: cargo ndk -t arm64-v8a -o ../../app/src/main/jniLibs build --release

      - name: Keystore de release (se configurado)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Testes JVM do extrator
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: AssembleRelease (R8 full mode)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -x lint --stacktrace

      - name: Tamanho e hash do APK
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          echo "APK: $apk"
          ls -lh "$apk"
          sha256sum "$apk" | tee "$RUNNER_TEMP/apk.sha256"

      - name: Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: fuzzy-downloader-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testes
          path: |
            app/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14
